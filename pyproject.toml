[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payment-qa-agent"
version = "0.3.0"
description = "A guarded AI workflow for triaging payment test failures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain-core>=1.7.4",
  "langchain-openai>=1.7.3",
  "langgraph>=1.2.19",
  "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/payment_qa_agent"]
