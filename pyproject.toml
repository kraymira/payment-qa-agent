[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payment-qa-agent"
version = "0.1.0"
description = "A guarded AI workflow for triaging payment test failures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/payment_qa_agent"]
